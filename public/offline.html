<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBBCL — Offline Mode</title>
  <style>
    body {
      background-color: #111625;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 40px 20px;
    }
    .logo-container {
      margin-bottom: 30px;
    }
    .logo-icon {
      width: 120px;
      height: 120px;
      fill: #9e7f46;
    }
    h1 {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ffffff;
      margin: 10px 0 20px 0;
    }
    .highlight {
      color: #9e7f46;
      font-weight: 500;
    }
    p {
      color: #b0afb5;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      background-color: #9e7f46;
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .btn:hover {
      background-color: #bfa571;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .cached-notice {
      margin-top: 15px;
      font-size: 12px;
      color: #767675;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <!-- Embedded Marine Insignia / Anchor Vector -->
      <svg class="logo-icon" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#9e7f46" stroke-width="2" />
        <path d="M50,15 L50,85 M30,55 L70,55 M30,80 C30,80 30,85 50,85 C70,85 70,80 70,80" fill="none" stroke="#9e7f46" stroke-width="4" stroke-linecap="round" />
        <circle cx="50" cy="25" r="5" fill="none" stroke="#9e7f46" stroke-width="3" />
      </svg>
    </div>
    
    <h1>CBBCL is <span class="highlight">temporarily offline</span></h1>
    <p>We are unable to connect to the Cox's Bazar Boat Club servers. This could be due to a poor network connection or temporary internet disruption.</p>
    
    <button class="btn" onclick="retryConnection()">Retry Connection</button>
    <div class="cached-notice">Or try refreshing once connection is restored to access cached material.</div>
  </div>

  <script>
    function retryConnection() {
      // Attempt to load home page
      window.location.href = "/";
    }

    // Automatically check online status
    window.addEventListener("online", () => {
      window.location.href = "/";
    });
  </script>
</body>
</html>
